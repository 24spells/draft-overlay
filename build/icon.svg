<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 24spells mark: a colorless-mana style "24" coin. Source for build/icon.png, icon.ico and the tray icons
       (scripts/make-icons.mjs renders it). The small variant (data-small) drops the shadow and thickens lines. -->
  <defs>
    <radialGradient id="face" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset="0.55" stop-color="#d2cdc6"/>
      <stop offset="1" stop-color="#a19b94"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8a83"/>
      <stop offset="1" stop-color="#5e5a55"/>
    </linearGradient>
  </defs>
  <circle class="shadow" cx="242" cy="270" r="230" fill="#08090b" opacity="0.6"/>
  <circle cx="256" cy="250" r="230" fill="url(#face)" stroke="url(#rim)" stroke-width="10"/>
  <ellipse class="shine" cx="214" cy="150" rx="132" ry="62" fill="#ffffff" opacity="0.22"/>
  <text x="256" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="262"
        letter-spacing="-14" fill="#16171b">24</text>
</svg>
